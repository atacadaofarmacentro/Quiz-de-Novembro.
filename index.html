<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Quiz Especial de Natal | Atacadão Farma Centro
  </title>

  <meta
    name="description"
    content="Quiz de Natal do Atacadão Farma Centro. Participe, acerte as perguntas e concorra a um cupom do sorteio de Natal!"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
      line-height: 1.5;
    }

    /* =====================================
        HEADER
    ===================================== */

    header {
      background: linear-gradient(
        135deg,
        #b40000,
        #e00000
      );

      color: white;

      padding: 18px 20px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.18);

      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-container {
      max-width: 1100px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;

      background: white;
      color: #c00000;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;
      font-weight: bold;
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .logo-text p {
      font-size: 13px;
      opacity: .95;
    }

    .header-button {
      background: white;
      color: #c00000;

      text-decoration: none;

      padding: 10px 16px;

      border-radius: 25px;

      font-weight: bold;
      font-size: 14px;

      transition: .2s;
    }

    .header-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 5px 12px rgba(0,0,0,.2);
    }


    /* =====================================
        BANNER
    ===================================== */

    .hero {
      max-width: 1100px;

      margin: 25px auto 15px;

      padding: 0 15px;
    }

    .christmas-banner {

      position: relative;

      overflow: hidden;

      border-radius: 20px;

      padding: 38px 25px;

      color: white;

      text-align: center;

      background:

        radial-gradient(
          circle at 10% 20%,
          rgba(255,255,255,.22) 0 3px,
          transparent 4px
        ),

        radial-gradient(
          circle at 80% 30%,
          rgba(255,255,255,.22) 0 3px,
          transparent 4px
        ),

        radial-gradient(
          circle at 30% 80%,
          rgba(255,255,255,.2) 0 3px,
          transparent 4px
        ),

        linear-gradient(
          135deg,
          #b40000,
          #e50000 55%,
          #8f0000
        );

      box-shadow:
        0 8px 25px rgba(0,0,0,.15);
    }

    .christmas-banner::before {

      content: "🎄";

      position: absolute;

      left: 20px;
      top: 15px;

      font-size: 50px;

      opacity: .92;
    }

    .christmas-banner::after {

      content: "🎅";

      position: absolute;

      right: 20px;
      bottom: 10px;

      font-size: 50px;

      opacity: .92;
    }

    .christmas-banner h2 {

      font-size: 32px;

      margin-bottom: 8px;

      font-weight: 900;
    }

    .christmas-banner p {

      font-size: 17px;

      max-width: 700px;

      margin: auto;
    }

    .christmas-highlight {

      display: inline-block;

      margin-top: 18px;

      padding: 10px 20px;

      background: white;

      color: #b40000;

      border-radius: 30px;

      font-weight: 900;

      font-size: 16px;
    }


    /* =====================================
        CONTAINER
    ===================================== */

    .container {

      max-width: 850px;

      margin: 25px auto 60px;

      padding: 0 15px;
    }


    /* =====================================
        CARD
    ===================================== */

    .card {

      background: white;

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 7px 25px rgba(0,0,0,.09);

      margin-bottom: 20px;
    }


    /* =====================================
        INTRO
    ===================================== */

    .intro-card {

      text-align: center;
    }

    .intro-card h2 {

      color: #b40000;

      font-size: 25px;

      margin-bottom: 10px;
    }

    .intro-card p {

      color: #555;

      margin-bottom: 15px;
    }

    .rules {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 15px;
    }

    .rule {

      background: #fff4f4;

      color: #a60000;

      border: 1px solid #ffd1d1;

      border-radius: 20px;

      padding: 8px 14px;

      font-size: 13px;

      font-weight: bold;
    }


    /* =====================================
        FORMULÁRIO
    ===================================== */

    .form-title {

      color: #b40000;

      font-size: 22px;

      margin-bottom: 7px;

      font-weight: 900;
    }

    .form-subtitle {

      color: #666;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .form-group {

      margin-bottom: 17px;
    }

    .form-group label {

      display: block;

      font-weight: bold;

      margin-bottom: 7px;

      color: #333;
    }

    .form-group input {

      width: 100%;

      padding: 14px 15px;

      border: 2px solid #e5e5e5;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      transition: .2s;
    }

    .form-group input:focus {

      border-color: #c00000;

      box-shadow:
        0 0 0 3px rgba(192,0,0,.08);
    }

    .privacy-text {

      font-size: 12px;

      color: #777;

      margin-top: 8px;
    }


    /* =====================================
        BOTÕES
    ===================================== */

    .btn {

      border: none;

      cursor: pointer;

      font-family: inherit;

      padding: 14px 22px;

      border-radius: 28px;

      font-weight: 900;

      font-size: 15px;

      transition: .2s;
    }

    .btn-primary {

      background:
        linear-gradient(
          135deg,
          #b40000,
          #e00000
        );

      color: white;

      box-shadow:
        0 5px 12px rgba(180,0,0,.25);
    }

    .btn-primary:hover {

      transform: translateY(-2px);

      box-shadow:
        0 8px 16px rgba(180,0,0,.3);
    }

    .btn-whatsapp {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      background: #25D366;

      color: white;

      text-decoration: none;

      padding: 15px 24px;

      border-radius: 30px;

      font-weight: 900;

      transition: .2s;
    }

    .btn-whatsapp:hover {

      transform: translateY(-2px);

      box-shadow:
        0 6px 15px rgba(37,211,102,.3);
    }


    /* =====================================
        ERRO
    ===================================== */

    .error-message {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #fff0f0;

      color: #b00000;

      font-weight: bold;

      text-align: center;
    }


    /* =====================================
        PROGRESSO
    ===================================== */

    .progress-wrapper {

      margin-bottom: 20px;
    }

    .progress-info {

      display: flex;

      justify-content: space-between;

      color: #666;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .progress-bar {

      height: 10px;

      background: #e9e9e9;

      border-radius: 20px;

      overflow: hidden;
    }

    .progress-fill {

      height: 100%;

      width: 20%;

      background:
        linear-gradient(
          90deg,
          #b40000,
          #e60000
        );

      border-radius: 20px;

      transition: width .3s ease;
    }


    /* =====================================
        PERGUNTAS
    ===================================== */

    .question-number {

      color: #b40000;

      font-size: 14px;

      font-weight: 900;

      margin-bottom: 8px;

      text-transform: uppercase;
    }

    .question {

      font-size: 21px;

      font-weight: 800;

      color: #222;

      margin-bottom: 22px;
    }

    .options {

      display: grid;

      gap: 12px;
    }

    .option {

      position: relative;
    }

    .option input {

      position: absolute;

      opacity: 0;

      pointer-events: none;
    }

    .option label {

      display: block;

      border: 2px solid #e5e5e5;

      border-radius: 13px;

      padding: 15px 16px;

      cursor: pointer;

      background: white;

      transition: all .2s ease;

      font-size: 15px;
    }

    .option label:hover {

      border-color: #d00000;

      background: #fff7f7;
    }

    .option input:checked + label {

      border-color: #c00000;

      background: #fff0f0;

      color: #a00000;

      font-weight: bold;

      box-shadow:
        0 3px 10px rgba(180,0,0,.1);
    }

    .option-letter {

      display: inline-flex;

      width: 30px;
      height: 30px;

      align-items: center;
      justify-content: center;

      background: #eee;

      border-radius: 50%;

      margin-right: 8px;

      font-weight: bold;

      color: #555;
    }

    .option input:checked + label .option-letter {

      background: #c00000;

      color: white;
    }


    /* =====================================
        ÁREA DOS BOTÕES
    ===================================== */

    .button-area {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      margin-top: 25px;
    }


    /* =====================================
        ENVIO WHATSAPP
    ===================================== */

    .whatsapp-card {

      display: none;

      text-align: center;
    }

    .whatsapp-icon {

      width: 80px;
      height: 80px;

      border-radius: 50%;

      background: #e7f9ee;

      margin: 0 auto 15px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 40px;
    }

    .whatsapp-card h2 {

      color: #b40000;

      font-size: 27px;

      margin-bottom: 10px;
    }

    .whatsapp-card p {

      color: #555;

      max-width: 600px;

      margin: 0 auto 20px;
    }

    .participation-id {

      display: inline-block;

      background: #f7f7f7;

      border: 1px dashed #aaa;

      border-radius: 10px;

      padding: 10px 16px;

      margin-bottom: 20px;

      font-weight: bold;

      color: #555;
    }


    /* =====================================
        AVISO
    ===================================== */

    .warning-box {

      max-width: 650px;

      margin: 20px auto 0;

      padding: 13px;

      background: #fff8e6;

      border: 1px solid #f0d58a;

      border-radius: 10px;

      color: #735900;

      font-size: 13px;
    }


    /* =====================================
        FOOTER
    ===================================== */

    footer {

      background: #a90000;

      color: white;

      text-align: center;

      padding: 28px 15px;
    }

    footer h3 {

      font-size: 19px;

      margin-bottom: 6px;
    }

    footer p {

      font-size: 13px;

      opacity: .9;

      margin-bottom: 5px;
    }

    footer a {

      color: white;

      font-weight: bold;

      text-decoration: none;
    }

    .footer-links {

      margin-top: 12px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 15px;
    }

        MOBILE
